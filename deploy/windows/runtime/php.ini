; DOXamigo — PHP for the native Windows install (Phase 6).
; Paths are relative to this php folder, so the install can live anywhere.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zend.enable_gc = On
expose_php = Off
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
; Laravel's own environment (.env) is read by the app; EGPCS also exposes service variables.
variables_order = "EGPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 55M
upload_max_filesize = 50M
max_file_uploads = 20
default_charset = "UTF-8"
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 30
realpath_cache_size = 4096K
realpath_cache_ttl = 600
cgi.fix_pathinfo = 1
cgi.force_redirect = 0

extension_dir = "ext"

; Required by DOXamigo (setup.ps1 checks these are loaded)
extension = bcmath
extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sodium
extension = sqlite3
extension = zip

zend_extension = opcache

[Date]
date.timezone = Africa/Cairo

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code only changes during an update, and the updater restarts the PHP services.
opcache.validate_timestamps = 0
opcache.save_comments = 1

[sqlite3]
sqlite3.defensive = 1
