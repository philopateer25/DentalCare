services:
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,WEBHOOKS
      
      # Authentication (This is your master password)
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=ApiKeyDentalCare20120
      
      # Database (PostgreSQL)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:secretpassword@evolution_db:5432/evolution?schema=public
      
      # Redis (Required for Evolution API v2+)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379
      - CACHE_REDIS_PREFIX_KEY=evo
      - REDIS_URI=redis://evolution_redis:6379
      - REDIS_PREFIX_KEY=evo
      
      # Webhook Global settings (for Step 3 later)
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_GLOBAL_ENABLED=false
    depends_on:
      - evolution_db
      - evolution_redis

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data

  evolution_db:
    image: postgres:15-alpine
    container_name: evolution_db
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

volumes:
  evolution_postgres_data:
  evolution_redis_data:
