services:
  nginx:
    build:
      context: .
      target: web-server
    container_name: clinic_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - clinic_network

  app:
    build:
      context: .
      target: production
    container_name: clinic_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Laravel's config/route/event caches live on the Docker volume, never in the shared
      # project folder (a cached config there would also be picked up by host-side test runs).
      APP_CONFIG_CACHE: /var/www/html/storage/framework/cache/config.php
      APP_ROUTES_CACHE: /var/www/html/storage/framework/cache/routes-v7.php
      APP_EVENTS_CACHE: /var/www/html/storage/framework/cache/events.php
    volumes:
      - .:/var/www/html
      - clinic_vendor:/var/www/html/vendor
      # Compiled views + framework cache live inside Docker: on a Windows bind mount every
      # page render paid for several slow cross-OS file checks per view.
      - clinic_framework:/var/www/html/storage/framework
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:ro
    networks:
      - clinic_network

  worker:
    build:
      context: .
      target: production
    container_name: clinic_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    # Use the project's entrypoint (bind-mounted) so `command` really runs; the
    # script baked into older images always started php-fpm and ignored it.
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    # Same user as php-fpm, so backups and logs written by scheduled jobs can be
    # read, downloaded and deleted from the web app (root wrote them 0600 before).
    user: "www-data"
    env_file:
      - .env
    environment:
      # Laravel's config/route/event caches live on the Docker volume, never in the shared
      # project folder (a cached config there would also be picked up by host-side test runs).
      APP_CONFIG_CACHE: /var/www/html/storage/framework/cache/config.php
      APP_ROUTES_CACHE: /var/www/html/storage/framework/cache/routes-v7.php
      APP_EVENTS_CACHE: /var/www/html/storage/framework/cache/events.php
    volumes:
      - .:/var/www/html
      - clinic_vendor:/var/www/html/vendor
      # Compiled views + framework cache live inside Docker: on a Windows bind mount every
      # page render paid for several slow cross-OS file checks per view.
      - clinic_framework:/var/www/html/storage/framework
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:ro
    depends_on:
      - app
      - redis
    networks:
      - clinic_network

  scheduler:
    build:
      context: .
      target: production
    container_name: clinic_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    # Use the project's entrypoint (bind-mounted) so `command` really runs; the
    # script baked into older images always started php-fpm and ignored it.
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    # Same user as php-fpm, so backups and logs written by scheduled jobs can be
    # read, downloaded and deleted from the web app (root wrote them 0600 before).
    user: "www-data"
    env_file:
      - .env
    environment:
      # Laravel's config/route/event caches live on the Docker volume, never in the shared
      # project folder (a cached config there would also be picked up by host-side test runs).
      APP_CONFIG_CACHE: /var/www/html/storage/framework/cache/config.php
      APP_ROUTES_CACHE: /var/www/html/storage/framework/cache/routes-v7.php
      APP_EVENTS_CACHE: /var/www/html/storage/framework/cache/events.php
    volumes:
      - .:/var/www/html
      - clinic_vendor:/var/www/html/vendor
      # Compiled views + framework cache live inside Docker: on a Windows bind mount every
      # page render paid for several slow cross-OS file checks per view.
      - clinic_framework:/var/www/html/storage/framework
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:ro
    depends_on:
      - app
    networks:
      - clinic_network

  db:
    image: mysql:8.0
    container_name: clinic_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-clinic_db}
      MYSQL_USER: ${DB_USERNAME:-clinic_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - clinic_db_data:/var/lib/mysql
    networks:
      - clinic_network

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: unless-stopped
    volumes:
      - clinic_redis_data:/data
    networks:
      - clinic_network

volumes:
  clinic_db_data:
  clinic_redis_data:
  clinic_vendor:
  clinic_framework:

networks:
  clinic_network:
    driver: bridge
