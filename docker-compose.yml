services:
  nginx:
    build:
      context: .
      target: web-server
    container_name: clinic_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - clinic_network

  app:
    build:
      context: .
      target: production
    container_name: clinic_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - clinic_vendor:/var/www/html/vendor
    networks:
      - clinic_network

  worker:
    build:
      context: .
      target: production
    container_name: clinic_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - clinic_vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis
    networks:
      - clinic_network

  scheduler:
    build:
      context: .
      target: production
    container_name: clinic_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - clinic_vendor:/var/www/html/vendor
    depends_on:
      - app
    networks:
      - clinic_network

  db:
    image: mysql:8.0
    container_name: clinic_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-clinic_db}
      MYSQL_USER: ${DB_USERNAME:-clinic_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - clinic_db_data:/var/lib/mysql
    networks:
      - clinic_network

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: unless-stopped
    volumes:
      - clinic_redis_data:/data
    networks:
      - clinic_network

volumes:
  clinic_db_data:
  clinic_redis_data:
  clinic_vendor:

networks:
  clinic_network:
    driver: bridge
